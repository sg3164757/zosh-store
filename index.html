<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Order Form</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; }
        body { font-family: Arial, sans-serif; background-color: #000; margin: 0; padding: 10px; color: white; text-align: center; }
        
        /* Container Design */
        .order-container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 15px; overflow: hidden; border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
        
        /* Choti Product Image & Header */
        .form-header { background: #000; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 2px solid var(--gold); }
        .thumb { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .form-header h2 { color: var(--gold); font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Google Form Integration */
        .iframe-wrapper { position: relative; width: 100%; height: 950px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .footer-note { font-size: 12px; color: #888; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header">
        <img src="model-product.jpg" class="thumb" alt="Thunder of Zosh">
        <h2>Order Now (C.O.D)</h2>
    </div>

    <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfWhniN486lFyY95w6QNIEPPcAu7fr1vA-Ybhzm5ilKU-R8xQ/viewform?embedded=true">
            Loading…
        </iframe>
    </div>
</div>

<p class="footer-note">🛡️ 100% Secure & Private Cash on Delivery</p>

</body>
</html>
