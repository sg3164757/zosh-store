<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh - Contact Form</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 350px; width: 100%; }
        h2 { color: #b22222; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Thunder of Zosh</h2>
        <p>Details paane ke liye form bharein</p>
        
        <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
            <input type="text" name="name" placeholder="Aapka Naam" required>
            <input type="tel" name="phone" placeholder="Mobile Number" required>
            <textarea name="address" placeholder="Aapka Poora Pata (Address)" rows="3" required></textarea>
            
            <button type="submit">Contact Me Fast</button>
        </form>
    </div>

</body>
</html>
