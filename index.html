<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now | Thunder of Zosh</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; }
        body { font-family: Arial, sans-serif; background-color: #000; margin: 0; padding: 10px; color: white; text-align: center; }
        
        .order-container { max-width: 500px; margin: 20px auto; background: #fff; border-radius: 15px; overflow: hidden; border: 3px solid var(--gold); box-shadow: 0 0 25px rgba(212, 175, 55, 0.3); }
        
        .form-header { background: #000; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 2px solid var(--gold); }
        .thumb { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .form-header h2 { color: var(--gold); font-size: 18px; margin: 0; text-transform: uppercase; }

        /* Form Height adjusted to show Submit button clearly */
        .iframe-wrapper { width: 100%; height: 900px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .footer-note { font-size: 11px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header">
        <img src="model-product.jpg" class="thumb" alt="Zosh">
        <h2>Thunder of Zosh - Order Form</h2>
    </div>

    <div class="iframe-wrapper">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfQa1JQqBhw5rNL37RLd6u5KYd4KyzGKM0ARjvQ6qbaiAK-WQ/viewform?embedded=true">
            Loading…
        </iframe>
    </div>
</div>

<p class="footer-note">Your privacy is our priority. 100% Secure Delivery.</p>

</body>
</html>
