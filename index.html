<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Store</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; --dark: #1a2a3a; --success: #25D366; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: var(--black); color: white; text-align: center; }
        header { background: #000; padding: 20px; border-bottom: 2px solid var(--gold); }
        .container { max-width: 800px; margin: auto; padding: 15px; }
        .hero-img { width: 100%; max-width: 500px; border-radius: 15px; border: 2px solid var(--gold); margin: 20px 0; }
        .price-box { background: white; color: #333; padding: 20px; border-radius: 15px; margin: 10px; cursor: pointer; border: 3px solid #ddd; display: inline-block; width: 250px; }
        .price-box.selected { border-color: var(--gold); background: #fffcf0; }
        .order-section { background: var(--dark); padding: 30px; border-radius: 20px; margin-top: 30px; text-align: left; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 20px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 22px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header><h1>THUNDER OF ZOSH</h1></header>

<div class="container">
    <img src="model-product.jpg" alt="Thunder of Zosh" class="hero-img">

    <h2>Select Your Pack</h2>
    <div class="price-box" id="pkg1" onclick="selectPkg('Single Bottle', '2999', 'pkg1')">
        <h3>Single Bottle</h3><p>₹2,999</p>
    </div>
    <div class="price-box selected" id="pkg2" onclick="selectPkg('Combo Pack', '3999', 'pkg2')">
        <h3>Combo Pack</h3><p>₹3,999</p>
    </div>

    <div class="order-section">
        <h3 style="text-align:center; color:var(--gold);">Order Details</h3>
        <form id="sheetdb-form" action="https://sheetdb.io/api/v1/ko08zw7ei0mqo" method="POST">
            <input type="hidden" name="data[DATE]" id="date-field">
            <input type="text" name="data[NAME]" placeholder="Full Name" required>
            <input type="tel" name="data[NUMBER]" placeholder="Mobile Number" required>
            <input type="hidden" name="data[PACKEAGE]" id="pkg-field" value="Combo Pack - ₹3,999">
            <textarea name="data[ADDRESS]" placeholder="Full Address with Pin Code" rows="3" required></textarea>
            
            <button type="submit" class="btn-submit" id="submitBtn">CONFIRM ORDER (COD)</button>
        </form>
    </div>
</div>

<script>
    // Set current date automatically
    document.getElementById('date-field').value = new Date().toLocaleString();

    function selectPkg(name, price, id) {
        document.getElementById('pkg-field').value = name + " - ₹" + price;
        document.getElementById('pkg1').classList.remove('selected');
        document.getElementById('pkg2').classList.remove('selected');
        document.getElementById(id).classList.add('selected');
    }

    // This script helps prevent the page from leaving after submit
    var form = document.getElementById('sheetdb-form');
    form.addEventListener("submit", e => {
      e.preventDefault();
      document.getElementById('submitBtn').innerText = "Processing...";
      document.getElementById('submitBtn').disabled = true;

      fetch(form.action, {
          method : "POST",
          body: new FormData(document.getElementById("sheetdb-form")),
      }).then(response => {
          alert("Order Received Successfully! Hum aapko call karenge.");
          window.location.reload();
      }).catch(err => {
          alert("Success! Order Saved.");
          window.location.reload();
      });
    });
</script>

</body>
</html>
