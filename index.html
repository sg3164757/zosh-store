<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form | Thunder of Zosh</title>
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --black: #0a0a0a; --success: #2ecc71; --field-bg: #1a1a1a; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #000; color: white; margin: 0; padding: 10px; }
        
        .order-container { max-width: 450px; margin: 10px auto; background: #111; border-radius: 15px; border: 1px solid var(--gold); overflow: hidden; box-shadow: 0 0 35px rgba(212,175,55,0.25); }
        
        /* Form Header */
        .form-header { 
            background: linear-gradient(135deg, var(--black), #1a1a1a); 
            border-bottom: 2px solid var(--gold);
            display: flex; 
            align-items: center; 
            padding: 12px 15px; 
            color: #fff;
        }

        .header-model-photo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            margin-right: 15px;
            box-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        .header-text { flex: 1; }
        .header-text h2 { margin: 0; font-size: 18px; text-transform: uppercase; color: var(--gold); letter-spacing: 0.5px; }
        .header-text p { margin: 3px 0 0; font-size: 12px; color: #ccc; }

        form { padding: 20px 25px; }

        .field-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}
        
        input, select, textarea { 
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; 
            background: var(--field-bg); color: #fff; font-size: 16px; box-sizing: border-box; transition: 0.3s; 
        }
        
        input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; }

        .btn-submit { 
            width: 100%; padding: 18px; background: linear-gradient(45deg, var(--gold), var(--gold-dark)); 
            color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: 900; 
            cursor: pointer; text-transform: uppercase; margin-top: 5px; transition: 0.3s;
        }
        
        .btn-submit:active { transform: scale(0.97); }

        /* Trust Badges */
        .trust-badges { display: flex; justify-content: space-between; padding: 12px 25px; background: #0a0a0a; border-top: 1px solid #222; }
        .badge { font-size: 9px; color: #777; text-align: center; text-transform: uppercase; }
        .badge span { display: block; font-size: 16px; margin-bottom: 2px; }

        /* Success Message */
        #success-msg { display: none; padding: 50px 20px; text-align: center; }
        #success-msg h3 { color: var(--success); font-size: 22px; margin-bottom: 10px; }
        .confetti { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="order-container">
    <div class="form-header" id="mainHeader">
        <img src="model-photo-crop.jpg" alt="Zosh Model" class="header-model-photo">
        <div class="header-text">
            <h2>Order Confirmation</h2>
            <p>Cash on Delivery Available</p>
        </div>
    </div>

    <form id="leadForm">
        <div class="field-group">
            <label>Full Name / पूरा नाम</label>
            <input type="text" id="name" placeholder="Name" required minlength="3">
        </div>

        <div class="field-group">
            <label>Phone Number / फ़ोन नंबर</label>
            <input type="tel" id="phone" placeholder="10-digit phone number" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="field-group">
            <label>Select Package / पैक चुनें</label>
            <select id="package">
                <option value="Combo Pack (2 Bottles)" selected>Combo Pack (2 Bottles) - Best Seller</option>
                <option value="Single Bottle">Single Bottle</option>
            </select>
        </div>

        <div class="field-group">
            <label>Shipping Address / पूरा पता</label>
            <textarea id="address" rows="3" placeholder="House No, Village/City, Pincode" required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Confirm Order (COD)</button>
    </form>

    <div id="success-msg">
        <div class="confetti">✅</div>
        <h3>ORDER RECEIVED!</h3>
        <p style="color: #ccc; font-size: 14px;">Hamari team aapko jald hi call karegi.</p>
    </div>

    <div class="trust-badges">
        <div class="badge"><span>📦</span>Discreet Packing</div>
        <div class="badge"><span>🌱</span>100% Ayurvedic</div>
        <div class="badge"><span>🚛</span>Free Shipping</div>
    </div>
</div>

<script>
    const scriptURL = 'https://sheetdb.io/api/v1/2qqhwik4r33j0'; 
    const form = document.getElementById('leadForm');
    const btn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('success-msg');
    const header = document.getElementById('mainHeader');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerHTML = "Saving Details...";
        btn.disabled = true;

        const data = {
            "Timestamp": new Date().toLocaleString('en-IN'),
            "Name": document.getElementById('name').value,
            "Phone number": document.getElementById('phone').value,
            "package": document.getElementById('package').value,
            "Address": document.getElementById('address').value
        };

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: [data] })
        })
        .then(response => {
            form.style.display = 'none';
            header.style.display = 'none'; 
            successMsg.style.display = 'block';
        })
        .catch(error => {
            alert('Something went wrong! Check connection.');
            btn.innerHTML = "Confirm Order (COD)";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
