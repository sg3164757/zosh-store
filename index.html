<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh - Order Now</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b1a2d; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { background: white; color: #333; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .product-img { width: 100%; max-width: 250px; height: auto; margin-bottom: 15px; border-radius: 10px; }
        h1 { color: #d4af37; margin: 10px 0; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #d4af37, #b8860b); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .privacy { font-size: 12px; color: #28a745; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <img src="gel.jpg" alt="Thunder of Zosh" class="product-img">
        
        <h1>THUNDER OF ZOSH</h1>
        <p>100% Natural Performance Gel</p>
        
        <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
            <input type="text" name="name" placeholder="Aapka Poora Naam" required>
            <input type="tel" name="phone" placeholder="WhatsApp Number" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <textarea name="address" placeholder="Poora Pata (Full Address)" rows="3" required></textarea>
            <input type="text" name="pincode" placeholder="Pin Code" required>

            <p class="privacy">🔒 Aapka data 100% secure aur private rahega.</p>
            <button type="submit">Submit & Order Now</button>
        </form>
    </div>

</body>
</html>
