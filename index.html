<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Brand Store</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; --dark-grey: #1a2a3a; --success: #25D366; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: var(--black); color: white; line-height: 1.6; }
        header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); }
        .container { max-width: 900px; margin: auto; padding: 15px; }

        .hero-container { text-align: center; margin-top: 10px; }
        .hero-img { width: 100%; max-width: 600px; border-radius: 15px; border: 2px solid var(--gold); box-shadow: 0 0 40px rgba(212, 175, 55, 0.3); }

        .section-title { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 2px; margin: 40px 0 20px; font-size: 26px; }
        
        /* Pricing Selection Style */
        .price-flex { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
        .price-box { background: white; color: #333; padding: 25px; border-radius: 20px; width: 280px; text-align: center; border: 4px solid #ddd; transition: 0.3s; cursor: pointer; position: relative; }
        
        /* Jab box select hoga tab ye style dikhega */
        .price-box.selected { border-color: var(--gold); background: #fffcf0; transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .price-box.selected::after { content: '✔ Selected'; position: absolute; top: -15px; background: var(--gold); color: black; padding: 3px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; left: 50%; transform: translateX(-50%); }

        .price-box h2 { margin: 0; font-size: 22px; color: var(--black); }
        .amount { font-size: 30px; font-weight: bold; color: #e74c3c; margin: 10px 0; }

        .order-section { background: var(--dark-grey); padding: 40px 20px; border-radius: 30px; margin-top: 50px; }
        input, textarea { width: 100%; padding: 15px; margin: 12px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 20px; background: linear-gradient(45deg, #25D366, #128C7E); color: white; border: none; border-radius: 12px; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<header>
    <h1 style="color:var(--gold); margin:0; letter-spacing: 3px;">THUNDER OF ZOSH</h1>
</header>

<div class="container">
    <div class="hero-container">
        <img src="model-product.jpg" alt="Thunder of Zosh" class="hero-img">
    </div>

    <h2 class="section-title">Select Your Package</h2>
    <div class="price-flex">
        <div class="price-box" id="pkg1" onclick="selectPkg('Single Bottle (Gel or Capsule)', 2999, 'pkg1')">
            <h2>Single Bottle</h2>
            <p>1 Month Course</p>
            <div class="amount">₹2,999</div>
        </div>

        <div class="price-box selected" id="pkg2" onclick="selectPkg('Combo Pack (Gel + Capsules)', 3999, 'pkg2')">
            <h2>Combo Pack</h2>
            <p>Full 1 Month Course</p>
            <div class="amount">₹3,999</div>
            <p style="color: var(--success); font-weight: bold;">(Most Recommended)</p>
        </div>
    </div>

    <div class="order-section">
        <h2 style="text-align: center; color: var(--gold); margin-top:0;">Secure Order Form</h2>
        <p style="text-align: center;">Selected: <strong id="display-pkg" style="color: var(--gold);">Combo Pack (Gel + Capsules) - ₹3,999</strong></p>
        
        <form id="orderForm">
            <input type="text" id="name" placeholder="Enter Your Full Name" required>
            <input type="tel" id="phone" placeholder="Enter WhatsApp Number" required>
            <textarea id="address" placeholder="Full Address with City & Pin Code"
