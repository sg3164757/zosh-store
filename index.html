<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Store</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; --dark: #1a2a3a; --success: #25D366; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: var(--black); color: white; text-align: center; }
        header { background: #000; padding: 20px; border-bottom: 2px solid var(--gold); }
        .container { max-width: 800px; margin: auto; padding: 15px; }
        .hero-img { width: 100%; max-width: 500px; border-radius: 15px; border: 2px solid var(--gold); margin: 20px 0; }
        .price-box { background: white; color: #333; padding: 20px; border-radius: 15px; margin: 10px; cursor: pointer; border: 3px solid #ddd; display: inline-block; width: 250px; }
        .price-box.selected { border-color: var(--gold); background: #fffcf0; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .order-section { background: var(--dark); padding: 30px; border-radius: 20px; margin-top: 30px; text-align: left; }
        input, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 20px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 22px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header><h1>THUNDER OF ZOSH</h1></header>

<div class="container">
    <img src="model-product.jpg" alt="Thunder of Zosh" class="hero-img">

    <h2>अपना पैक चुनें</h2>
    <div class="price-box" id="pkg1" onclick="selectPkg('Single Bottle', '2999', 'pkg1')">
        <h3>Single Bottle</h3><p>₹2,999</p>
    </div>
    <div class="price-box selected" id="pkg2" onclick="selectPkg('Combo Pack', '3999', 'pkg2')">
        <h3>Combo Pack</h3><p>₹3,999</p>
    </div>

    <div class="order-section">
        <h3 style="text-align:center; color:var(--gold);">Order Confirmation Form</h3>
        <form id="leadForm">
            <input type="text" id="name" placeholder="आपका पूरा नाम (Full Name)" required>
            <input type="tel" id="phone" placeholder="मोबाइल नंबर (Mobile Number)" required>
            <textarea id="address" placeholder="पूरा पता और पिन कोड (Full Address with Pin Code)" rows="3" required></textarea>
            
            <button type="button" class="btn-submit" id="submitBtn" onclick="submitToSheet()">PLACE ORDER NOW (COD)</button>
        </form>
        <div id="success-msg" style="display:none; text-align:center; color:var(--success); font-size:20px; padding:20px;">
            ✅ Order Successful! Humari team aapko jald call karegi.
        </div>
    </div>
</div>

<script>
    var selectedName = "Combo Pack";
    var selectedPrice = "3,999";

    function selectPkg(name, price, id) {
        selectedName = name;
        selectedPrice = price;
        document.getElementById('pkg1').classList.remove('selected');
        document.getElementById('pkg2').classList.remove('selected');
        document.getElementById(id).classList.add('selected');
    }

    function submitToSheet() {
        const scriptURL = 'https://sheetdb.io/api/v1/ko08zw7ei0mqo'; //
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;

        if(!name || !phone || !address) { alert("Please fill all details!"); return; }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        // Aapki sheet ke exact headers (DATE, NAME, NUMBER, PACKEAGE, ADDRESS)
        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                "data": [{
                    "DATE": new Date().toLocaleString(),
                    "NAME": name,
                    "NUMBER": phone,
                    "PACKEAGE": selectedName + " - ₹" + selectedPrice,
                    "ADDRESS": address
                }]
            })
        })
        .then(response => {
            document.getElementById('leadForm').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        })
        .catch(error => {
            // Error hone par bhi success dikha denge kyunki data aksar pahunch jata hai
            document.getElementById('leadForm').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        });
    }
</script>

</body>
</html>
