<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Store</title>
    <style>
        :root { --gold: #d4af37; --black: #050a12; --success: #25D366; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--black); color: white; margin: 0; padding: 10px; text-align: center; }
        .order-card { max-width: 450px; margin: 20px auto; background: #111; padding: 25px; border-radius: 20px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
        .thumb { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 15px; }
        h2 { color: var(--gold); text-transform: uppercase; margin: 0 0 20px; font-size: 20px; }
        input, textarea, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #fff; color: #000; font-size: 16px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 20px; background: linear-gradient(45deg, #d4af37, #b8860b); color: black; border: none; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        #success { display: none; color: var(--success); font-weight: bold; margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>

<div class="order-card">
    <img src="model-product.jpg" class="thumb" alt="Zosh">
    <h2>Confirm Your Order</h2>

    <form id="zoshForm">
        <input type="text" id="custName" placeholder="Full Name (पूरा नाम)" required minlength="3">
        <input type="tel" id="custPhone" placeholder="Mobile Number (10 Digits)" maxlength="10" pattern="[0-9]{10}" required>
        
        <select id="custPkg">
            <option value="Combo Pack - ₹3,999">Combo Pack (Recommended) - ₹3,999</option>
            <option value="Single Bottle - ₹2,999">Single Bottle - ₹2,999</option>
        </select>

        <textarea id="custAdd" placeholder="Full Delivery Address" rows="3" required minlength="10"></textarea>
        
        <button type="button" class="btn-submit" id="sBtn" onclick="submitLead()">PLACE ORDER NOW (COD)</button>
    </form>

    <div id="success">✅ ORDER PLACED! Hum aapko call karenge.</div>
</div>

<script>
    function submitLead() {
        const url = 'https://sheetdb.io/api/v1/zzak31booz9kj'; //
        const n = document.getElementById('custName').value.trim();
        const p = document.getElementById('custPhone').value.trim();
        const a = document.getElementById('custAdd').value.trim();
        const pkg = document.getElementById('custPkg').value;

        if(n.length < 3 || p.length < 10 || a.length < 10) { alert("Sahi jankari bharein!"); return; }

        const btn = document.getElementById('sBtn');
        btn.innerText = "SENDING..."; btn.disabled = true;

        // EXACT HEADER MATCHING as per image_6a4a06.png
        const payload = {
            "data": [{
                "Timestamp": new Date().toLocaleString(),
                "Name": n, 
                "Phone number": p,
                "package": pkg,
                "Address": a
            }]
        };

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('zoshForm').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        })
        .catch(() => {
            document.getElementById('zoshForm').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        });
    }
</script>
</body>
</html>
