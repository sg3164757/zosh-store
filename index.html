<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Order | Thunder of Zosh</title>
    <style>
        :root { --gold: #d4af37; --gold-dark: #b8860b; --black: #0a0a0a; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #000; color: white; margin: 0; padding: 10px; }
        
        /* Premium Container */
        .order-card { max-width: 420px; margin: 15px auto; background: linear-gradient(145deg, #1a1a1a, #0d0d0d); padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 15px 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; }
        
        /* Luxury Border Glow */
        .order-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

        .prod-img { width: 85px; height: 85px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; box-shadow: 0 0 15px var(--gold); transition: 0.3s; }
        .prod-img:hover { transform: scale(1.1); }
        
        h2 { color: var(--gold); font-size: 20px; margin: 0 0 5px; text-transform: uppercase; letter-spacing: 2px; }
        .stock-tag { background: #ff4d4d; color: white; font-size: 10px; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; animation: blink 1.5s infinite; }
        
        @keyframes blink { 50% { opacity: 0.5; } }

        .field { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--gold); background: #2a2a2a; outline: none; box-shadow: 0 0 10px rgba(212,175,55,0.2); }

        /* Trust Icons */
        .trust-icons { display: flex; justify-content: space-around; margin: 20px 0; border-top: 1px solid #333; padding-top: 15px; font-size: 10px; color: #888; }
        .icon-item { text-align: center; }

        .btn-confirm { width: 100%; padding: 20px; background: linear-gradient(45deg, var(--gold), var(--gold-dark)); color: #000; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 20px rgba(212,175,55,0.3); transition: 0.3s; }
        .btn-confirm:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212,175,55,0.5); }
        .btn-confirm:active { transform: scale(0.98); }

        #msg { display: none; padding: 30px; color: var(--gold); font-weight: bold; font-size: 20px; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="order-card">
    <img src="model-product.jpg" class="prod-img" alt="Zosh">
    <h2>Thunder of Zosh</h2>
    <div class="stock-tag">⚠️ ONLY 7 PACKS LEFT IN STOCK</div>

    <form id="zoshOrder">
        <div class="field">
            <label>Your Full Name</label>
            <input type="text" id="n" placeholder="Enter Full Name" required minlength="3">
        </div>

        <div class="field">
            <label>Mobile Number (For Delivery)</label>
            <input type="tel" id="p" placeholder="10 Digit Number" pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="field">
            <label>Select Best Offer</label>
            <select id="pkg">
                <option value="Single Bottle - ₹2,999">Single Bottle - ₹2,999</option>
                <option value="Combo Pack - ₹3,999" selected>Combo Pack (Save ₹2000) - ₹3,999</option>
            </select>
        </div>

        <div class="field">
            <label>Full Shipping Address</label>
            <textarea id="a" rows="3" placeholder="House no, Area, City, Pincode" required minlength="10"></textarea>
        </div>

        <button type="submit" class="btn-confirm" id="b">Confirm Order (COD)</button>

        <div class="trust-icons">
            <div class="icon-item">🚚<br>Fast Delivery</div>
            <div class="icon-item">📦<br>Discreet Packing</div>
            <div class="icon-item">💰<br>Cash on Delivery</div>
        </div>
    </form>

    <div id="msg">
        🏆 ORDER SUCCESSFUL!<br>
        <span style="font-size: 14px; color: #888;">Our executive will call you within 15 mins.</span>
    </div>
</div>

<script>
    document.getElementById('zoshOrder').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('b');
        btn.innerText = "VERIFYING...";
        btn.disabled = true;

        const data = {
            "Timestamp": new Date().toLocaleString(),
            "Name": document.getElementById('n').value,
            "Phone number": document.getElementById('p').value,
            "package": document.getElementById('pkg').value,
            "Address": document.getElementById('a').value
        };

        // Your New SheetDB API
        fetch('https://sheetdb.io/api/v1/2qqhwik4r33j0', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: [data] })
        })
        .then(() => {
            document.getElementById('zoshOrder').style.display = 'none';
            document.getElementById('msg').style.display = 'block';
        })
        .catch(() => {
            alert("Error! Please try again.");
            btn.disabled = false;
            btn.innerText = "Confirm Order (COD)";
        });
    });
</script>

</body>
</html>
