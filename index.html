<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunder of Zosh | Official Store</title>
    <style>
        :root { --gold: #d4af37; --black: #0a0a0a; --white: #ffffff; }
        body { font-family: 'Poppins', Arial, sans-serif; background-color: var(--black); color: var(--white); margin: 0; padding: 20px; }
        
        /* Premium Card Design */
        .order-box { max-width: 450px; margin: auto; background: #151515; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(212, 175, 55, 0.2); text-align: center; }
        
        .product-header img { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; }
        h2 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }

        /* Custom Form Look (Not Google Form) */
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--gold); margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }

        .btn-order { width: 100%; padding: 20px; background: linear-gradient(45deg, #d4af37, #b8860b); color: #000; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; transition: 0.3s; }
        .btn-order:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }

        #thank-you { display: none; padding: 40px 20px; color: #28a745; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="order-box">
    <div class="product-header">
        <img src="model-product.jpg" alt="Thunder of Zosh">
        <h2>Order Now</h2>
    </div>

    <form id="premiumForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="u_name" placeholder="Apna pura naam likhein" required minlength="3">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="u_phone" placeholder="10-digit Mobile Number" pattern="[0-9]{10}" required>
        </div>

        <div class="input-group">
            <label>Select Pack</label>
            <select id="u_pack">
                <option value="Combo Pack - ₹3,999">Combo Pack (Recommended) - ₹3,999</option>
                <option value="Single Bottle - ₹2,999">Single Bottle - ₹2,999</option>
            </select>
        </div>

        <div class="input-group">
            <label>Delivery Address</label>
            <textarea id="u_address" rows="3" placeholder="Pura pata aur Pin Code" required minlength="10"></textarea>
        </div>

        <button type="submit" class="btn-order" id="submitBtn">Confirm Order (COD)</button>
    </form>

    <div id="thank-you">
        ✅ ORDER PLACED!<br>Humari team aapko jald call karegi.
    </div>
</div>
